[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon"
version = "0.1.0"
description = "Network Traffic Monitoring & Intelligent Path Selection — inspired by SD-WAN path-selection concepts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx2>=2.10.0",      # needed by TestClient / async test client
    "anyio>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
